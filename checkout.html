<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>結帳 - TXY GAMING</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', 'Microsoft JhengHei', sans-serif;
            background-color: #0a0a0a;
            color: #e5e7eb;
        }
        .neon-glow-cyan:hover {
            box-shadow: 0 0 5px theme('colors.cyan.400'), 
                        0 0 15px theme('colors.cyan.500'), 
                        0 0 25px theme('colors.cyan.600');
        }
        .form-input {
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: white;
            padding: 0.75rem;
            border-radius: 0.375rem;
            width: 100%;
            transition: all 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: #22d3ee;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.2);
        }
    </style>
</head>
<body class="bg-black text-gray-200 min-h-screen">

    <header class="bg-gray-900/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-800">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-white tracking-wider">
                TXY<span class="text-cyan-400">.</span>
            </a>
            <a href="index.html" class="text-gray-400 hover:text-cyan-400 transition-colors">← 返回商城</a>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-12">
        <h1 class="text-3xl md:text-4xl font-bold mb-8 text-center">購物車 <span class="text-cyan-400">結帳</span></h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            <!-- 左側：寄送與支付資訊 -->
            <div class="lg:col-span-2 space-y-8">
                <!-- 1. 寄送資訊 -->
                <section class="bg-gray-900 p-8 rounded-lg border border-gray-800">
                    <h2 class="text-xl font-semibold mb-6 flex items-center">
                        <span class="w-8 h-8 bg-cyan-500 text-black rounded-full flex items-center justify-center mr-3 font-bold text-sm">1</span>
                        寄送資訊
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2">姓名</label>
                            <input type="text" placeholder="您的姓名" class="form-input">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2">電話</label>
                            <input type="tel" placeholder="0912-345-678" class="form-input">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-400 mb-2">電子郵件</label>
                            <input type="email" placeholder="example@email.com" class="form-input">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-400 mb-2">寄送地址</label>
                            <input type="text" placeholder="請輸入詳細地址" class="form-input">
                        </div>
                    </div>
                </section>

                <!-- 2. 支付方式 -->
                <section class="bg-gray-900 p-8 rounded-lg border border-gray-800">
                    <h2 class="text-xl font-semibold mb-6 flex items-center">
                        <span class="w-8 h-8 bg-cyan-500 text-black rounded-full flex items-center justify-center mr-3 font-bold text-sm">2</span>
                        支付方式
                    </h2>
                    <div class="space-y-4">
                        <label class="flex items-center p-4 border border-gray-800 rounded-lg cursor-pointer hover:border-cyan-500 transition-colors bg-gray-950">
                            <input type="radio" name="payment" class="w-4 h-4 text-cyan-500" checked>
                            <span class="ml-4 flex items-center">
                                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                                信用卡 / 簽帳金融卡
                            </span>
                        </label>
                        <label class="flex items-center p-4 border border-gray-800 rounded-lg cursor-pointer hover:border-cyan-500 transition-colors">
                            <input type="radio" name="payment" class="w-4 h-4 text-cyan-500">
                            <span class="ml-4 flex items-center">
                                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                網路轉帳 (ATM)
                            </span>
                        </label>
                        <label class="flex items-center p-4 border border-gray-800 rounded-lg cursor-pointer hover:border-cyan-500 transition-colors">
                            <input type="radio" name="payment" class="w-4 h-4 text-cyan-500">
                            <span class="ml-4 flex items-center">
                                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                貨到付款 (僅限小件商品)
                            </span>
                        </label>
                    </div>
                </section>
            </div>

            <!-- 右側：訂單摘要 -->
            <div class="lg:col-span-1">
                <div class="bg-gray-900 p-8 rounded-lg border border-gray-800 sticky top-28">
                    <h2 class="text-xl font-semibold mb-6">訂單摘要</h2>
                    
                    <div class="space-y-4 mb-6">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center">
                                <img src="https://images.unsplash.com/photo-1627843563095-f6e94676cfe0?q=80&w=100&auto=format&fit=crop" class="w-12 h-12 rounded object-cover mr-4">
                                <div>
                                    <p class="text-sm font-medium">TXY Nebula X</p>
                                    <p class="text-xs text-gray-500">數量: 1</p>
                                </div>
                            </div>
                            <p class="text-sm font-bold">NT$ 128,000</p>
                        </div>
                        <div class="flex justify-between items-center">
                            <div class="flex items-center">
                                <img src="https://images.unsplash.com/photo-1613110332856-c737482c3c99?q=80&w=100&auto=format&fit=crop" class="w-12 h-12 rounded object-cover mr-4">
                                <div>
                                    <p class="text-sm font-medium">BlackShark V2</p>
                                    <p class="text-xs text-gray-500">數量: 1</p>
                                </div>
                            </div>
                            <p class="text-sm font-bold">NT$ 3,590</p>
                        </div>
                    </div>

                    <div class="border-t border-gray-800 pt-4 space-y-2 text-sm">
                        <div class="flex justify-between text-gray-400">
                            <span>小計</span>
                            <span>NT$ 131,590</span>
                        </div>
                        <div class="flex justify-between text-gray-400">
                            <span>運費</span>
                            <span class="text-cyan-400">免運</span>
                        </div>
                        <div class="flex justify-between text-xl font-bold text-white pt-4">
                            <span>總計</span>
                            <span class="text-cyan-400">NT$ 131,590</span>
                        </div>
                    </div>

                    <button class="w-full mt-8 bg-cyan-500 text-black font-bold py-4 rounded-md transition-all duration-300 hover:bg-cyan-400 neon-glow-cyan">
                        確認並下單
                    </button>
                    
                    <p class="text-center text-xs text-gray-500 mt-4">
                        點擊「確認並下單」即表示您同意我們的<br>
                        <a href="#" class="underline hover:text-cyan-400">服務條款</a>與<a href="#" class="underline hover:text-cyan-400">隱私權政策</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-8 text-center text-sm text-gray-500">
        <p>&copy; 2024 TXY GAMING Inc. Secure Checkout.</p>
    </footer>

</body>
</html>
